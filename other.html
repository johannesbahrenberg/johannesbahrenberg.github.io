      <!-- =========================================================
           ONE PHOTO = one <li class="photo"> block. Copy a block to add one.
           - Put the photo in images/other/ and use its name in BOTH places
             (the href="..." and the src="...").
           - alt="..." describes the picture for screen readers.
           - Every photo is cropped to the same shape (set in gallery.css).
             If the crop cuts off something important, add for example
             style="object-position: 50% 20%" to the <img> (left-right, top-bottom).
           ========================================================= -->
      <ul class="gallery">

        <li>
          <figure class="photo">
            <a class="photo__link" href="images/other/vienna.jpg">

              <h2 class="photo__title">Vienna Meeting</h2>

            </figcaption>

        </li>
